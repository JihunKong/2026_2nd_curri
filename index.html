<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026학년도 2학기 공통국어2 수행평가 안내</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#16233d;--mut:#6b7690;--line:#e3e7ef;--bg:#f6f8fb;--card:#fff;
 --c0:#0d7f8a;--c0b:#e6f4f5;--c1:#b06a00;--c1b:#fdf1de;--c2:#6b3fc7;--c2b:#f0eafc}
html{scroll-behavior:smooth}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans',
 'Noto Sans Sinhala','Iskoola Pota','Nirmala UI','Sinhala Sangam MN',sans-serif;
 background:var(--bg);color:var(--ink);line-height:1.75;-webkit-text-size-adjust:100%}
body[data-lang="si"]{line-height:1.95}
.wrap{max-width:960px;margin:0 auto;padding:0 18px 80px}

.langbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);
 backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.langin{max-width:960px;margin:0 auto;padding:9px 18px;display:flex;gap:7px;
 align-items:center;flex-wrap:wrap}
.lang{font:inherit;font-size:13.5px;font-weight:700;padding:6px 13px;border-radius:20px;
 border:1px solid var(--line);background:#fff;color:var(--mut);cursor:pointer;transition:.15s}
.lang:hover{border-color:#2a5fa8;color:#2a5fa8}
.lang.on{background:#16305c;border-color:#16305c;color:#fff}
.kotog{margin-left:auto;display:flex;gap:7px;align-items:center;font-size:13px;
 color:var(--mut);cursor:pointer;user-select:none}
.kotog input{width:15px;height:15px;accent-color:#16305c}
.kosub{display:block;font-size:12.5px;color:#93a0b8;margin-top:2px;line-height:1.6;
 font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}
body:not(.showko) .kosub,body[data-lang="ko"] .kosub{display:none}

header{background:linear-gradient(140deg,#16305c,#2a5fa8 55%,#3f7bc9);color:#fff;
 padding:44px 18px 38px;margin-bottom:26px}
header .in{max-width:960px;margin:0 auto}
header .kicker{font-size:14px;opacity:.85}
header h1{font-size:33px;line-height:1.35;margin:8px 0 6px;font-weight:800}
header .sub{font-size:16px;opacity:.9}
header .who{margin-top:18px;font-size:14px;opacity:.8}
header .kosub{color:rgba(255,255,255,.72)}

.sectitle{font-size:20px;font-weight:800;margin:38px 0 14px;padding-left:12px;
 border-left:5px solid #2a5fa8}
.lead{color:var(--mut);font-size:15px;margin:-6px 0 16px}
.note{font-size:13.5px;color:var(--mut);margin-top:9px}

.ov{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ovcard{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);
 border-radius:14px;padding:18px 16px 16px;text-align:left;cursor:pointer;font:inherit;
 color:inherit;transition:.18s;box-shadow:0 1px 3px rgba(20,35,70,.05)}
.ovcard:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(20,35,70,.12)}
.ovtop{display:flex;align-items:center;gap:7px;margin-bottom:8px;flex-wrap:wrap}
.ovemoji{font-size:20px}.ovemoji.big{font-size:38px}
.ovno{font-size:12px;font-weight:800;color:var(--c)}
.ovarea{font-size:11px;background:var(--c2c);color:var(--c);padding:2px 8px;
 border-radius:20px;font-weight:700}
.ovcard h3{font-size:17px;font-weight:800;line-height:1.45}
.ovwhen{font-size:13px;color:var(--mut);margin-top:5px}
.ovbar{height:7px;background:#eef1f6;border-radius:6px;margin:12px 0 7px;overflow:hidden}
.ovbar span{display:block;height:100%;background:var(--c);border-radius:6px}
.ovpt{font-size:12.5px;color:var(--mut)}
.ratio{display:flex;gap:8px;margin-top:14px;font-size:13px;flex-wrap:wrap}
.ratio div{background:#fff;border:1px solid var(--line);border-radius:10px;
 padding:9px 12px;flex:1;text-align:center;min-width:112px}
.ratio b{display:block;font-size:19px}

.sched{list-style:none;position:relative;padding-left:20px}
.sched:before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--line)}
.sched li{position:relative;display:flex;gap:14px;padding:9px 0;flex-wrap:wrap}
.sched li:before{content:'';position:absolute;left:-19px;top:17px;width:11px;height:11px;
 border-radius:50%;background:#fff;border:3px solid #b9c3d6}
.sched .sc0:before{border-color:var(--c0)}.sched .sc1:before{border-color:var(--c1)}
.sched .sc2:before{border-color:var(--c2)}.sched .sc3:before{border-color:#16305c}
.scwhen{min-width:132px;font-size:13.5px;color:var(--mut);font-weight:700;padding-top:1px}
.scwhat{flex:1;min-width:220px}
.scwhat b{font-size:15.5px}
.scwhat em{display:block;font-style:normal;font-size:13.5px;color:var(--mut)}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{font:inherit;font-size:14px;font-weight:700;padding:9px 15px;border-radius:24px;
 border:1px solid var(--line);background:#fff;color:var(--mut);cursor:pointer;transition:.15s}
.tab:hover{border-color:var(--c);color:var(--c)}
.tab.on{background:var(--c);border-color:var(--c);color:#fff}

.panel{display:none;background:var(--card);border:1px solid var(--line);
 border-radius:16px;padding:26px 24px 28px}
.panel.on{display:block}
.phead{display:flex;gap:16px;align-items:flex-start;padding-bottom:18px;
 border-bottom:2px solid var(--c2c);margin-bottom:6px}
.pno{font-size:12.5px;font-weight:800;color:var(--c)}
.phead h2{font-size:25px;font-weight:800;line-height:1.4}
.pmeta{font-size:13.5px;color:var(--mut);margin-top:5px}
.sec{font-size:16px;font-weight:800;margin:26px 0 10px}
.task{background:var(--c2c);border-radius:12px;padding:15px 17px;font-size:14.5px}

.steps{list-style:none}
.steps li{display:flex;gap:13px;padding:11px 0;border-bottom:1px dashed var(--line)}
.steps li:last-child{border:0}
.num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--c);color:#fff;
 font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px}
.stepbody{font-size:14.5px}.stepbody b{color:var(--c)}

table{width:100%;border-collapse:collapse;font-size:14px}
.rubric th{background:var(--c2c);color:var(--c);font-size:13px;padding:9px 10px;text-align:left}
.rubric td{border-bottom:1px solid var(--line);padding:11px 10px;vertical-align:top}
.rb-name{width:30%}
.rb-sub{display:block;font-size:12.5px;color:var(--mut);font-weight:400;margin-top:2px}
.rb-desc{font-size:13.5px}
.rb-pt{width:58px;text-align:center;font-weight:800;font-size:17px;color:var(--c)}
.rb-sum td{font-weight:800;background:#fafbfd}.rb-sum td:last-child{text-align:center;font-size:17px}

.levels{display:flex;flex-direction:column;gap:8px}
.lv{display:flex;gap:11px;align-items:flex-start;font-size:14px}
.lvbadge{flex:0 0 26px;height:26px;border-radius:8px;color:#fff;font-weight:800;
 font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.lvA{background:#1a7f4b}.lvB{background:#2a5fa8}.lvC{background:#8a7a2f}

.submit li,.stds li{font-size:14px;margin-left:20px;padding:4px 0}
.stds code{background:#eef2f8;border-radius:5px;padding:1px 6px;font-size:12.5px;color:#2a5fa8}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips span{background:var(--c2c);color:var(--c);border-radius:8px;padding:6px 12px;
 font-size:13px;font-weight:700}
.works td{border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:top}
.wtag{background:var(--c2c);color:var(--c);border-radius:6px;padding:2px 9px;
 font-size:12px;font-weight:800;white-space:nowrap}
.wdesc{font-size:13px;color:var(--mut)}

.rules{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rule{background:#fff;border:1px solid var(--line);border-left:4px solid #2a5fa8;
 border-radius:11px;padding:14px 16px}
.rule b{font-size:14.5px}.rule p{font-size:13.5px;color:var(--mut);margin-top:4px}

.ckwrap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ckbox{background:#fff;border:1px solid var(--line);border-top:4px solid var(--c);
 border-radius:12px;padding:15px 16px}
.ckbox h4{font-size:14.5px;margin-bottom:9px;color:var(--c)}
.ck{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;padding:5px 0;cursor:pointer}
.ck input{margin-top:5px;width:15px;height:15px;accent-color:var(--c);flex:0 0 auto}
.ck input:checked+span{color:var(--mut);text-decoration:line-through}
.prog{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px 16px}
.progbar{height:9px;background:#eef1f6;border-radius:6px;overflow:hidden;margin-top:8px}
.progbar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#2a5fa8,#3f7bc9);
 border-radius:6px;transition:.3s}

.gwrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gr td{border-bottom:1px solid var(--line);padding:8px 10px}
.gr td:last-child{width:70px;text-align:center;font-weight:800;color:#fff}
.gA{background:#1a7f4b}.gB{background:#2a5fa8}.gC{background:#8a7a2f}
.gD{background:#b06a00}.gE{background:#9a4040}

footer{text-align:center;color:var(--mut);font-size:13px;margin-top:46px;
 padding-top:20px;border-top:1px solid var(--line)}

@media print{
 body{background:#fff}.langbar{display:none}
 .panel{display:block!important;page-break-before:always;border:0;padding:0}
 .tabs{display:none}
 header{background:#16305c!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .ovcard,.rule,.ckbox,.sched li{page-break-inside:avoid}
}
@media (max-width:820px){
 .ov,.rules,.ckwrap{grid-template-columns:1fr}
 header h1{font-size:26px}.rb-name{width:34%}.panel{padding:20px 16px}
 .scwhen{min-width:100%}
}
</style></head>

<nav class="langbar"><div class="langin">

<header><div class="in" id="hd"></div></header>

<div class="wrap">

  <div class="gwrap"><table class="gr"><tbody id="grade"></tbody></table></div>
  <p class="note" id="n_grade"></p>

  <footer id="ft"></footer>
</div>

ào tháng 9, tháng 10 và tháng 11. ④ Ở lần nộp cuối, các em chọn 15 từ trong số đã gom được và viết lại thành bản thảo 「Từ điển nhập môn」 cho các em khóa sau vào trường năm tới đọc. Các em được dùng công cụ dịch cho bản nháp lời giải nghĩa, nhưng ‘lời giải nghĩa bằng lời của em’ và ‘câu do em tự đặt’ thì em phải tự viết.", "steps": [{"label": "Mở sổ", "body": "Các em mở 「Sổ từ vựng tiếng Hàn」 (Google Sheets) riêng mà thầy đã gửi. Đường link chỉ mình em xem được."}, {"label": "Gom từ", "body": "Từ mới gặp lần đầu trong giờ Quốc ngữ, hay từ em hiểu nghĩa nhưng khó dùng, thì mỗi ngày ghi lại một dòng."}, {"label": "Điền đầy đủ", "body": "Với mỗi từ, các em điền ㉠ lời giải nghĩa trong từ điển ㉡ lời giải nghĩa viết lại bằng lời của em ㉢ câu có trong sách giáo khoa ㉣ câu do em tự đặt ㉤ từ tương ứng trong tiếng mẹ đẻ và chỗ khác nhau về nghĩa."}, {"label": "Xét kỹ", "body": "Với những từ em thấy rối khi viết hoặc khi phát âm, các em giải thích thêm vì sao viết như vậy, dựa trên hai nguyên tắc chính tả (“viết theo âm đọc” / “viết theo hình thái ngữ pháp”)."}, {"label": "Nộp bài", "body": "Tháng 9, tháng 10 và tháng 11, mỗi tháng một lần, các em nộp sổ từ vựng đã làm được qua Google Forms thầy gửi. Cả ba lần đều tính điểm."}, {"label": "Để lại cho khóa sau", "body": "Cuối cùng, các em chọn 15 từ trong số đã gom và viết lại thành bản thảo 「Từ điển nhập môn」 cho các em khóa sau vào trường năm tới đọc. Các em dùng <phiếu học tập ②-3>."}], "rubric": [{"name": "Gom từ vựng có chăm chỉ không", "sub": "Số từ tích lũy và sự đều đặn", "desc": "Qua ba lần nộp, gom được từ 30 từ trở lên, bài học nào cũng ghi không bỏ sót, và tích lũy đều đặn suốt cả học kỳ.", "pt": 25}, {"name": "Lời giải nghĩa và ví dụ dùng từ có chính xác không", "sub": "Lời giải nghĩa bằng lời của em, đặt câu", "desc": "Chuyển lời giải nghĩa của từ điển sang lời của mình một cách chính xác, tự đặt được câu làm bật lên cách dùng của từ, và chỉ ra cụ thể chỗ khác nghĩa so với từ tương ứng trong tiếng mẹ đẻ.", "pt": 30}, {"name": "Nhìn lại cách viết và ngữ pháp", "sub": "Giải thích bằng nguyên tắc chính tả", "desc": "Chọn từ 10 trường hợp viết dễ nhầm trở lên, chỉ rõ đó là nguyên tắc “viết theo âm đọc” hay “viết theo hình thái ngữ pháp” và giải thích chính xác, đồng thời nhìn lại thói quen viết của bản thân.", "pt": 25}, {"name": "Biên tập có nghĩ đến người đọc", "sub": "Bản thảo 「Từ điển nhập môn」 cho khóa sau", "desc": "Tránh những từ mà khóa sau chưa biết, giải nghĩa bằng lời dễ hiểu, thêm câu ví dụ, hình vẽ, từ đồng nghĩa cho hợp lý, và hoàn thành 15 mục từ dễ đọc cho bản thảo từ điển.", "pt": 20}], "levels": [{"g": "A", "txt": "Gom từ đều đặn suốt học kỳ, sắp xếp lời giải nghĩa và ví dụ dùng từ một cách chính xác, giải thích đúng những chỗ viết dễ nhầm bằng nguyên tắc chính tả, và chỉnh bản thảo từ điển rất hoàn chỉnh có nghĩ đến trình độ của người đọc là các em khóa sau."}, {"g": "B", "txt": "Gom từ đều đặn, sắp xếp được lời giải nghĩa và ví dụ dùng từ, giải thích những chỗ viết dễ nhầm bằng nguyên tắc chính tả, và viết bản thảo từ điển có nghĩ đến người đọc là các em khóa sau."}, {"g": "C", "txt": "Gom từ và ghi lại lời giải nghĩa cùng ví dụ dùng từ, sửa lại cho đúng những chỗ viết dễ nhầm, và viết bản thảo từ điển đủ hình thức cơ bản."}], "submit": ["「Sổ từ vựng tiếng Hàn」 trên Google Sheets (nộp qua Google Forms 1 lần mỗi tháng: tháng 9, 10, 11)", "Phiếu học tập ②-1 Thẻ từ vựng (bản viết tay dự phòng)", "Phiếu học tập ②-2 Xét kỹ những chỗ viết dễ nhầm", "Phiếu học tập ②-3 Bản thảo 「Từ điển nhập môn」 cho khóa sau, 15 mục từ", "Phiếu ghi lại việc dùng trí tuệ nhân tạo (AI)", "Phiếu tự đánh giá và đánh giá bạn"], "stds": [{"code": "04-02", "txt": "Vận dụng nguyên tắc của quy tắc chính tả tiếng Hàn để nhìn lại đời sống ngôn ngữ của mình và giải quyết vấn đề."}, {"code": "04-01", "txt": "Hiểu những thay đổi của tiếng Hàn xuất hiện trong đời sống ngôn ngữ xưa và nay, và tham gia phát triển văn hóa ngôn ngữ Hàn."}]}, {"name": "Đọc truyện xưa của Hàn Quốc bằng MICA", "period": "Tuần 2 tháng 11 ~ tuần 3 tháng 11", "weight": "20%", "task": "Trong sáu truyện xưa của Hàn Quốc mà thầy đã đưa lên MICA (nền tảng học tập đa ngôn ngữ) — 〈Thần thoại Dangun (Dangun sinhwa)〉·〈Thần thoại Jumong (Jumong sinhwa)〉 (thần thoại), 〈Yeonorang và Seonyeo (Yeonorang gwa Seonyeo)〉·〈Cậu bé thần lực Uturi (Agijangsu Uturi)〉 (truyền thuyết), 〈Hai anh em hóa thành mặt trời và mặt trăng (Haewa dari doen onui)〉·〈Nàng tiên ốc (Ureong gaksi)〉 (truyện cổ tích dân gian) — các em chọn một truyện và thử sức với khóa học tự học. ① Đọc: dùng bản dịch đa ngôn ngữ của MICA để đọc song song tiếng mẹ đẻ và tiếng Hàn, rồi sắp xếp lại cốt truyện và những cảnh còn lạ lẫm. ② Đặt câu hỏi: xem qua các câu hỏi MICA tạo sẵn, sau đó tự em đặt 5 câu hỏi mà em thật sự muốn hỏi, chia thành ba nhóm: kiểm tra thông tin · diễn giải · nối với cuộc sống. ③ Tạo câu trả lời: dùng MICA tạo thử câu trả lời cho từng câu hỏi ở nhiều dạng khác nhau (tóm tắt · hội thoại · bảng · kể lại truyện…), rồi đối chiếu với căn cứ trong tác phẩm xem có khớp không và sửa lại. Các em giữ lại cả câu trả lời do máy tạo và câu trả lời em đã sửa, đặt cạnh nhau. ④ Báo cáo: viết lại toàn bộ quá trình trên thành 「Báo cáo tìm hiểu truyện xưa」 (khoảng 1.000 chữ), trong đó có đặc điểm của thể loại mà tác phẩm thuộc về (thần thoại · truyền thuyết · truyện cổ tích dân gian), bối cảnh thời đại, cách diễn giải và đánh giá của riêng em, cùng phần so sánh với truyện xưa của nước em. ⑤ Vấn đáp: các em chiếu màn hình Chromebook lên màn hình lớp bằng Chromecast, vừa cho cả lớp xem câu hỏi và câu trả lời của mình vừa nói trong 4~5 phút, sau đó trả lời câu hỏi của thầy và của các bạn kèm căn cứ.", "steps": [{"label": "Chọn khóa học", "body": "Các em chọn một trong sáu truyện xưa có trên MICA rồi bắt đầu khóa học."}, {"label": "Đọc", "body": "Dùng bản dịch đa ngôn ngữ của MICA để đọc song song tiếng của em và tiếng Hàn. Ghi cốt truyện và những cảnh còn lạ lẫm vào <phiếu học tập ③-1>."}, {"label": "Đặt câu hỏi", "body": "Các em đọc trước nh    ['l_grade',U.l_grade,KU.l_grade],['n_grade',U.n_grade,KU.n_grade],
   ['ft',U.footer,KU.footer]].forEach(function(a){
     document.getElementById(a[0]).innerHTML=T(a[1],a[2]);
   });
  document.getElementById('proglabel').textContent=U.lb_prog;

  bind(); go(cur); updProg();
}

function bind(){
  document.querySelectorAll('[data-go]').forEach(function(el){
    el.onclick=function(){
      go(+el.getAttribute('data-go'));
      if(el.classList.contains('ovcard'))
        document.getElementById('t_detail').scrollIntoView({block:'start'});
    };
  });
  document.querySelectorAll('.ck input').forEach(function(b){b.onchange=updProg;});
}
function go(i){
  cur=i;
  document.querySelectorAll('.tab').forEach(function(t,k){t.classList.toggle('on',k===i);});
  document.querySelectorAll('.panel').forEach(function(p,k){p.classList.toggle('on',k===i);});
}
function updProg(){
  var b=document.querySelectorAll('.ck input'),n=0;
  b.forEach(function(x){if(x.checked)n++;});
  var p=b.length?Math.round(n/b.length*100):0;
  document.getElementById('pct').textContent=p+'%';
  document.getElementById('pbar').style.width=p+'%';
}

var lb='';
ORDER.forEach(function(lg){
  lb+='<button class="lang" data-lang="'+lg+'">'+LABEL[lg]+'</button>';
});
document.getElementById('langs').innerHTML=lb;
document.querySelectorAll('.lang').forEach(function(b){
  b.onclick=function(){
    lang=b.getAttribute('data-lang');
    document.querySelectorAll('.lang').forEach(function(x){
      x.classList.toggle('on',x===b);});
    render();
  };
});
document.querySelector('.lang').classList.add('on');
document.getElementById('kochk').onchange=function(){
  showko=this.checked;
  document.body.classList.toggle('showko',showko);
  render();
};
render();
</script>
</body></html>
